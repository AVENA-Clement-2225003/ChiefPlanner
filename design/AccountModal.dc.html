<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: 'Public Sans', sans-serif; color: #1A1D23;">

  <div style="position: absolute; inset: 0; background: #F7F8FA; display: flex; flex-direction: column;">
    <div style="height: 72px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: #FFFFFF; border-bottom: 1px solid #E2E5EA;">
      <div style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700;">Chief Planner</div>
      <div style="display: flex; align-items: center; gap: 20px;">
        <div style="font-size: 14px; font-weight: 600; color: {{accent}};">Accueil</div>
        <div style="font-size: 14px; font-weight: 500; color: #5B6270;">Plats</div>
        <div style="font-size: 14px; font-weight: 500; color: #5B6270;">Ingredients</div>
        <div style="font-size: 14px; font-weight: 500; color: #5B6270;">MealFlows</div>
        <div style="font-size: 14px; font-weight: 500; color: #5B6270;">Tous les plats</div>
        <div style="width: 56px; height: 28px; border-radius: 999px; background: #EEF0F3;"></div>
        <div style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid #E2E5EA;"></div>
        <div style="width: 36px; height: 36px; border-radius: 999px; background: {{accentTint}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: {{accent}};">CP</div>
      </div>
    </div>
    <div style="padding: 40px; display: flex; flex-direction: column; gap: 24px;">
      <div style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 600;">Bonjour</div>
      <div style="display: flex; gap: 16px;">
        <div style="flex: 1; background: #FFFFFF; border: 1px solid #E2E5EA; border-radius: 14px; padding: 18px 20px; height: 88px;"></div>
        <div style="flex: 1; background: #FFFFFF; border: 1px solid #E2E5EA; border-radius: 14px; padding: 18px 20px; height: 88px;"></div>
        <div style="flex: 1; background: #FFFFFF; border: 1px solid #E2E5EA; border-radius: 14px; padding: 18px 20px; height: 88px;"></div>
        <div style="flex: 1; background: #FFFFFF; border: 1px solid #E2E5EA; border-radius: 14px; padding: 18px 20px; height: 88px;"></div>
      </div>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(20, 22, 26, 0.55);"></div>

  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 920px; height: 600px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 32px 64px rgba(0,0,0,0.35); display: flex; overflow: hidden;">

    <div style="flex: 1; padding: 36px; display: flex; flex-direction: column; gap: 32px; overflow: hidden;">

      <div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600;">Preferences</div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5B6270;">Apparence</div>
        <div style="display: flex; gap: 16px;">
          <div style="width: 190px; padding: 16px; border-radius: 12px; border: 2px solid {{accent}}; background: {{accentTint}}; display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.5"><rect x="2" y="4" width="20" height="13" rx="2"></rect><path d="M8 20h8M12 17v3"></path></svg>
            <div style="font-size: 13px; font-weight: 600;">Systeme</div>
          </div>
          <div style="width: 190px; padding: 16px; border-radius: 12px; border: 1px solid #E2E5EA; display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B6270" stroke-width="1.5"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"></path></svg>
            <div style="font-size: 13px; font-weight: 600; color: #5B6270;">Clair</div>
          </div>
          <div style="width: 190px; padding: 16px; border-radius: 12px; border: 1px solid #E2E5EA; display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#5B6270" stroke="none"><path d="M12 3a7 7 0 1 0 8.5 8.5A7 7 0 0 1 12 3z"></path></svg>
            <div style="font-size: 13px; font-weight: 600; color: #5B6270;">Sombre</div>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5B6270;">Couleur d'accent</div>
        <div style="display: flex; gap: 16px; align-items: center;">
          <div style="width: 34px; height: 34px; border-radius: 999px; background: #7C5CFC;"></div>
          <div style="width: 34px; height: 34px; border-radius: 999px; background: #E24C4C;"></div>
          <div style="width: 34px; height: 34px; border-radius: 999px; background: #F0883E;"></div>
          <div style="width: 40px; height: 40px; border-radius: 999px; background: #2A8FE0; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #2A8FE0;"></div>
          <div style="width: 34px; height: 34px; border-radius: 999px; background: #14B8A6;"></div>
        </div>
      </div>

    </div>

    <div style="width: 240px; flex-shrink: 0; border-left: 1px solid #E2E5EA; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px;">

      <div style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin-bottom: 8px;">
        <div style="width: 32px; height: 32px; border-radius: 999px; background: {{accentTint}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: {{accent}};">CP</div>
        <div style="font-size: 13px; font-weight: 600;">Mon compte</div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: {{accentTint}};">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2"><path d="M4 6h10M4 12h16M4 18h10"></path><circle cx="17" cy="6" r="1.6" fill="{{accent}}"></circle><circle cx="8" cy="12" r="1.6" fill="{{accent}}"></circle><circle cx="17" cy="18" r="1.6" fill="{{accent}}"></circle></svg>
        <div style="font-size: 14px; font-weight: 600; color: {{accent}};">Preferences</div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6270" stroke-width="2"><path d="M12 3l8 4v2H4V7z"></path><path d="M4 21V9M20 21V9M8 21v-8M12 21v-8M16 21v-8"></path></svg>
        <div style="font-size: 14px; font-weight: 500; color: #1A1D23;">Notifications</div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6270" stroke-width="2"><ellipse cx="12" cy="6" rx="8" ry="3"></ellipse><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"></path><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"></path></svg>
        <div style="font-size: 14px; font-weight: 500; color: #1A1D23;">Donnees</div>
      </div>

      <div style="height: 1px; background: #E2E5EA; margin: 8px 0;"></div>

      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6270" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"></path></svg>
        <div style="font-size: 14px; font-weight: 500; color: #1A1D23;">Administration</div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6270" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
        <div style="font-size: 14px; font-weight: 500; color: #1A1D23;">Legal</div>
      </div>

    </div>

    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6270" stroke-width="2" style="position: absolute; top: 24px; right: 264px;"><path d="M6 6l12 12M18 6L6 18"></path></svg>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#2A8FE0","options":["#7C5CFC","#E24C4C","#F0883E","#2A8FE0","#14B8A6"]}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2A8FE0';
    const map = {
      '#7C5CFC': { tint: '#EDE9FE' },
      '#E24C4C': { tint: '#FBE7E7' },
      '#F0883E': { tint: '#FDECD9' },
      '#2A8FE0': { tint: '#E3F1FC' },
      '#14B8A6': { tint: '#DAF5F1' }
    };
    const m = map[accent] || map['#2A8FE0'];
    return { accent: accent, accentTint: m.tint };
  }
}
</script>
</body>
</html>
