server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers hashés : cache long.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker et manifeste : toujours revalidés pour que les mises à jour arrivent.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Application monopage : toute autre route renvoie index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
