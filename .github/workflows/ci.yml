name: CI

# Every push is tested, so the checks show on the pull request of any branch of a stack.
on:
  push:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: chiefplanner_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpunit
      # Same tests again on MySQL, the database of production (the default run uses SQLite in memory).
      - run: vendor/bin/phpunit
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: chiefplanner_test
          DB_USERNAME: root
          DB_PASSWORD: root

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Push sur `master` (prod, tag latest) et `dev` (tag dev) : images vers GHCR une fois les tests passés.
  # Watchtower, sur le serveur, redémarre les conteneurs quand une image change.
  images:
    needs: [api, web]
    # Only dev and master publish images; the other branches are just tested.
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nom de l'image et tag
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_NAME}" = "master" ]; then echo "tag=latest" >> "$GITHUB_OUTPUT"; else echo "tag=dev" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/chiefplanner-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/chiefplanner-front:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=front
          cache-to: type=gha,scope=front,mode=max
